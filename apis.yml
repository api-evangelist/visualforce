aid: visualforce
name: Visualforce
description: >-
  Visualforce is a framework that enables developers to build sophisticated,
  custom user interfaces that can be hosted natively on the Salesforce platform.
  It uses a tag-based markup language similar to HTML and provides a
  component-based development model for building pages, email templates, and
  PDF documents within Salesforce.
